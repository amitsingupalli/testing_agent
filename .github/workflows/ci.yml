name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-tests:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync

      - name: Run self-tests
        run: uv run pytest -q

  demo-runs:
    name: live layers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync dependencies
        run: uv sync

      - name: Unit layer (node-demo)
        run: uv run testing-agent run --path examples/node-demo --type unit --profile ci --junit

      - name: Security layer (node-demo)
        run: uv run testing-agent run --path examples/node-demo --type security

      - name: System layer (webapp-demo)
        run: uv run testing-agent run --path examples/webapp-demo --type system

      - name: Diff-aware regression (self)
        run: uv run testing-agent run --path . --type regression --select all
